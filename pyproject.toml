[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tailwhip"
version = "0.1.0"
description = "CLI para busca semântica e léxica em metadados Oracle"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "sentence-transformers>=3",
    "chromadb>=0.5",
    "rank-bm25>=0.2",
    "pandas>=2",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
]

[project.scripts]
tailwhip = "tailwhip.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["tailwhip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tailwhip --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"